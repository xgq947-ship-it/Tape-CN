name: Feature Request
description: Suggest an idea or enhancement for Tape
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing to Tape! Please describe the feature you would like to see.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use Case / Context
      description: Which screen and Dock size do you use, and what would you like the tape to show?
    validations:
      required: false
